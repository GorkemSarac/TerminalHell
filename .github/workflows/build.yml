name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the .NET Framework C# compiler
        shell: powershell
        run: .\build.ps1

      - name: Check that every level can be completed
        shell: powershell
        run: |
          .\bin\TerminalHell.exe --dev-check
          if ($LASTEXITCODE -ne 0) { throw "level check failed" }

      - name: Menu and update-version checks
        shell: powershell
        run: |
          .\bin\TerminalHell.exe --dev-menu
          if ($LASTEXITCODE -ne 0) { throw "menu test failed" }

      - name: Save test (a played level survives a save and load)
        shell: powershell
        run: |
          .\bin\TerminalHell.exe --dev-save
          if ($LASTEXITCODE -ne 0) { throw "save test failed" }

      - name: Airport test (unarmed start, boarding gate, the incident, key carrier, old saves)
        shell: powershell
        run: |
          .\bin\TerminalHell.exe --dev-terminal
          if ($LASTEXITCODE -ne 0) { throw "airport test failed" }

      - name: Parry and jump test
        shell: powershell
        run: |
          .\bin\TerminalHell.exe --dev-moves
          if ($LASTEXITCODE -ne 0) { throw "parry / jump test failed" }

      - name: Exit door and one-way seal door test
        shell: powershell
        run: |
          .\bin\TerminalHell.exe --dev-exit
          if ($LASTEXITCODE -ne 0) { throw "exit door test failed" }
          .\bin\TerminalHell.exe --dev-seal
          if ($LASTEXITCODE -ne 0) { throw "seal door test failed" }
          .\bin\TerminalHell.exe --dev-secret2
          if ($LASTEXITCODE -ne 0) { throw "check-in secret test failed" }
          .\bin\TerminalHell.exe --dev-talk
          if ($LASTEXITCODE -ne 0) { throw "npc chatter test failed" }
          .\bin\TerminalHell.exe --dev-automap-aim
          if ($LASTEXITCODE -ne 0) { throw "automap aim test failed" }
          .\bin\TerminalHell.exe --dev-imp
          if ($LASTEXITCODE -ne 0) { throw "lesser demon test failed" }
          .\bin\TerminalHell.exe --dev-runway
          if ($LASTEXITCODE -ne 0) { throw "runway level test failed" }
          .\bin\TerminalHell.exe --dev-tower
          if ($LASTEXITCODE -ne 0) { throw "tower level test failed" }

      - name: Soak test (random bot plays every level)
        shell: powershell
        run: |
          .\bin\TerminalHell.exe --dev-soak
          if ($LASTEXITCODE -ne 0) { throw "soak test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: TerminalHell
          path: bin/TerminalHell.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the Linux version (one self-contained file)
        run: dotnet publish linux/TerminalHell.Linux.csproj -c Release -r linux-x64 -o out -nologo

      - name: Input self test (escape sequences, key releases, mouse, /dev/input parsing)
        run: ./out/terminalhell --dev-linux-selftest

      - name: Check that every level can be completed
        run: ./out/terminalhell --dev-check

      - name: Menu test (clicking a setting changes it the right way)
        run: ./out/terminalhell --dev-menu

      - name: Save test (a played level survives a save and load)
        run: ./out/terminalhell --dev-save

      - name: Parry and jump test
        run: ./out/terminalhell --dev-moves

      - name: Soak test (random bot plays every level)
        run: ./out/terminalhell --dev-soak

      - name: Play inside a pseudo terminal (drawing, keys, Ctrl+C, SIGTERM, terminal restored)
        run: python3 linux/tests/pty_smoke.py ./out/terminalhell

      - uses: actions/upload-artifact@v4
        with:
          name: terminalhell-linux-x64
          path: out/terminalhell
